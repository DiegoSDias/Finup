name: finup

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: application
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: finup
      DB_USERNAME: finup
      DB_PASSWORD: finup
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: application
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: finup
      DB_USERNAME: finup
      DB_PASSWORD: finup
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work --tries=3 --timeout=240 --sleep=3
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: finup
      MYSQL_USER: finup
      MYSQL_PASSWORD: finup
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -plocal-root-password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql-data:
